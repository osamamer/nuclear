name: Release Fork

# Every push to master publishes a Linux build of this fork as a GitHub release,
# with the latest.json the in-app updater reads (see plugins.updater in
# packages/player/src-tauri/tauri.conf.json). Installed copies update themselves.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-fork
  cancel-in-progress: false

env:
  DO_NOT_TRACK: 1

jobs:
  release:
    if: github.repository == 'osamamer/nuclear'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute fork version
        run: |
          CONF=packages/player/src-tauri/tauri.conf.json
          BASE=$(jq -r .version "$CONF" | sed 's/-.*//')
          VERSION="${BASE}-osama.$(git rev-list --count HEAD)"
          jq --arg v "$VERSION" '.version = $v' "$CONF" > "$CONF.tmp" && mv "$CONF.tmp" "$CONF"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Get PNPM store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/player/src-tauri/target/
          key: ${{ runner.os }}-cargo-fork-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fork-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gstreamer1.0-libav

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles appimage,deb
          tagName: v__VERSION__
          releaseName: Nuclear (osama fork) v__VERSION__
          releaseBody: Automated build of ${{ github.sha }}. Installed copies update themselves; for a first install grab the AppImage or .deb below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
