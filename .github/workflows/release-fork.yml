name: Release Fork

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-fork
  cancel-in-progress: false

env:
  DO_NOT_TRACK: 1

jobs:
  release:
    if: github.repository == 'osamamer/nuclear'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute fork version
        run: |
          CONF=packages/player/src-tauri/tauri.conf.json
          BASE=$(jq -r .version "$CONF" | sed 's/-.*//')
          VERSION="${BASE}-osama.$(git rev-list --count HEAD)"
          jq --arg v "$VERSION" '.version = $v' "$CONF" > "$CONF.tmp" && mv "$CONF.tmp" "$CONF"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Get PNPM store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/player/src-tauri/target/
          key: ${{ runner.os }}-cargo-fork-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fork-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gstreamer1.0-libav libasound2 libgbm1 libnss3 libxss1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chromium Debian package
        run: |
          pnpm --filter @nuclearplayer/player exec tauri build --bundles deb --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}'
          mkdir -p release-assets
          scripts/build-chromium-deb.sh \
            "packages/player/src-tauri/target/release/bundle/deb/Nuclear_${VERSION}_amd64.deb" \
            "release-assets/Nuclear_${VERSION}_amd64.deb"

      - name: Sign package and write updater manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          asset="Nuclear_${VERSION}_amd64.deb"
          pnpm --filter @nuclearplayer/player exec tauri signer sign "$GITHUB_WORKSPACE/release-assets/$asset"
          jq -n --arg version "$VERSION" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/$asset" \
            --rawfile signature "release-assets/$asset.sig" \
            '{version: $version, platforms: {"linux-x86_64-deb": {url: $url, signature: ($signature | rtrimstr("\n"))}}}' \
            > release-assets/latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release-assets/* --clobber
          else
            gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" \
              --title "Nuclear v$VERSION" --notes "Debian build with sandboxed Chromium from $GITHUB_SHA."
          fi
